# Local browser testing only. Production/default remains one active session.
# Apply after docker-compose.yml; do not deploy this override to production.
services:
  go-api:
    environment:
      SIGNALGEN_MAX_ACTIVE_SESSIONS: "5"
      SIGNALGEN_CORS_ORIGINS: http://127.0.0.1:5174,http://127.0.0.1:5175
