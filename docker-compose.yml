services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file:
      - backend/.env
    environment:
      SIGNALGEN_DB_PATH: /workspace/backend/runtime/signalgen.db
    ports:
      - "3456:3456"
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - signalgen-backend-data:/workspace/backend/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3456/api', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend-test:
    profiles:
      - test
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    env_file:
      - backend/.env
    environment:
      SIGNALGEN_DB_PATH: /tmp/signalgen-test.db

volumes:
  signalgen-backend-data:
