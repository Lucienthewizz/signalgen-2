services:
  backend:
    profiles:
      - legacy
    build:
      context: .
      dockerfile: legacy/python/Dockerfile
      target: runtime
    env_file:
      - backend/.env
    environment:
      SIGNALGEN_DB_PATH: /workspace/backend/runtime/signalgen.db
    ports:
      - "3456:3456"
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - signalgen-backend-data:/workspace/backend/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3456/api', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend-test:
    profiles:
      - legacy-test
    build:
      context: .
      dockerfile: legacy/python/Dockerfile
      target: test
    env_file:
      - backend/.env
    environment:
      SIGNALGEN_DB_PATH: /tmp/signalgen-test.db

  go-api:
    build:
      context: .
      dockerfile: backend/Go.Dockerfile
      target: api-runtime
    env_file:
      - backend/.env
    environment:
      SIGNALGEN_GO_API_ADDR: :8080
      SIGNALGEN_REDIS_URL: redis://market-cache:6379/0
    depends_on:
      market-cache:
        condition: service_started
    networks: [default, market-cache]
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Bound request logs; cloud retention/access is a separate deployment choice.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  market-cache:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    # Disposable public-price cache: no published port and no archive volume.
    networks: [market-cache]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 2s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  market-cache:
    internal: true

volumes:
  signalgen-backend-data:
